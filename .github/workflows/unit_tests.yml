name: Unit tests

on:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:

# Least privilege in source rather than inherited from mutable repo/org defaults: this job
# compiles and runs PR-controlled test code, so its token must not be write-capable.
permissions:
  contents: read

jobs:
  unit_tests:
    name: Build and run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          # Do not leave the job token in .git/config: the steps below build and execute
          # PR-controlled sources, which could otherwise read it back out.
          persist-credentials: false

      - name: Install dependencies
        run: sudo apt-get install -y libcmocka-dev cmake lcov

      - name: Configure
        run: cmake -B unit-tests/build -S unit-tests -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build unit-tests/build

      - name: Run tests
        run: ctest --test-dir unit-tests/build -V --output-on-failure

      - name: Generate coverage
        run: cd unit-tests && bash gen_coverage.sh

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # Named "subset" deliberately: LCOV only reports translation units the build
          # instrumented, and the signing/APDU/display sources are not host-compiled, so
          # this percentage is not project-wide coverage. gen_coverage.sh carries the
          # scope lists (V-031).
          name: unit-subset-coverage
          # A missing report means coverage generation failed; do not pass silently.
          if-no-files-found: error
          path: |
            unit-tests/coverage.info
            unit-tests/coverage/
