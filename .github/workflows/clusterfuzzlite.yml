name: ClusterFuzzLite fuzzing tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 13 * * 6'  # At 01:00 PM, only on Saturday

permissions: read-all

jobs:
  prepare_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix_json: ${{ steps.set_matrix.outputs.matrix }}
    steps:
      # No 'undefined' entry, and it is not an oversight (Cerberus V-027 stays open).
      #
      # oss-fuzz's bad_build_check requires a target to expose at least
      # THRESHOLD_FOR_NUMBER_OF_EDGES=100 coverage edges. Measured with that checker:
      # fuzz_vault_group_tlv has 173 edges and fuzz_vault_tlv 157, both of which pass, but
      # fuzz_key_batch has 46 and is rejected with "only partial coverage instrumentation"
      # / "does not seem to be compiled with UBSan", failing the whole matrix entry.
      #
      # That target is small by nature: its subject is a handful of header-inline
      # comparisons over 32-byte keys, so there is no honest way to reach 100 edges.
      # Enabling UBSan therefore needs either a materially larger key-batch target or
      # oss-fuzz's broken-target allowance raised, and the latter would also mask real
      # breakage. UBSan-only defect classes (invalid shifts, signed overflow, enum misuse)
      # remain uncovered in CI until then.
      - name: Set sanitizer matrix
        id: set_matrix
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            MATRIX='[{"sanitizer":"address","mode":"code-change"},{"sanitizer":"memory","mode":"code-change"}]'
          else
            MATRIX='[{"sanitizer":"address","mode":"batch"},{"sanitizer":"memory","mode":"batch"},{"sanitizer":"address","mode":"prune"},{"sanitizer":"coverage","mode":"coverage"}]'
          fi
          echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"

  Fuzzing:
    name: ${{ matrix.mode }} (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    needs: prepare_matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare_matrix.outputs.matrix_json) }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name }}-${{ matrix.mode }}-${{ matrix.sanitizer }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Build Fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          language: c
          sanitizer: ${{ matrix.sanitizer }}

      - name: Run Fuzzers
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: ${{ github.event_name == 'pull_request' && 300 || (matrix.mode == 'coverage' && 18000 || 600) }}
          mode: ${{ matrix.mode }}
          sanitizer: ${{ matrix.sanitizer }}
          output-sarif: ${{ github.event_name == 'pull_request' }}
