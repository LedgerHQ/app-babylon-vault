name: ClusterFuzzLite fuzzing tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 13 * * 6'  # At 01:00 PM, only on Saturday

permissions: read-all

jobs:
  prepare_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix_json: ${{ steps.set_matrix.outputs.matrix }}
    steps:
      # 'undefined' is included alongside address and memory, not instead of them: they catch
      # disjoint classes.  The local fallback in fuzzing/CMakeLists.txt adds -fsanitize=undefined
      # only when LIB_FUZZING_ENGINE is absent, which it never is here, so UBSan-only defects
      # (invalid shifts, signed overflow, enum misuse) were outside the CI matrix entirely (V-027).
      - name: Set sanitizer matrix
        id: set_matrix
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            MATRIX='[{"sanitizer":"address","mode":"code-change"},{"sanitizer":"memory","mode":"code-change"},{"sanitizer":"undefined","mode":"code-change"}]'
          else
            MATRIX='[{"sanitizer":"address","mode":"batch"},{"sanitizer":"memory","mode":"batch"},{"sanitizer":"undefined","mode":"batch"},{"sanitizer":"address","mode":"prune"},{"sanitizer":"coverage","mode":"coverage"}]'
          fi
          echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"

  Fuzzing:
    name: ${{ matrix.mode }} (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    needs: prepare_matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare_matrix.outputs.matrix_json) }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name }}-${{ matrix.mode }}-${{ matrix.sanitizer }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Build Fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          language: c
          sanitizer: ${{ matrix.sanitizer }}

      - name: Run Fuzzers
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: ${{ github.event_name == 'pull_request' && 300 || (matrix.mode == 'coverage' && 18000 || 600) }}
          mode: ${{ matrix.mode }}
          sanitizer: ${{ matrix.sanitizer }}
          output-sarif: ${{ github.event_name == 'pull_request' }}
